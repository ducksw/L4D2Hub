<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.12.1/font/bootstrap-icons.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
    crossorigin="anonymous"></script>
  <link rel="stylesheet" href="css/admin.css">
  <link rel="icon" href="icon.webp" type="image/gif" sizes="16x16">
  <title>L4D2 Hub - panel</title>
</head>

<body>

  <header id="header_admin"></header>

  <section class="d-flex">
    <div id="nav_bar"></div>

    <div class="w-100 p-4">
      <div class="d-flex justify-content-between align-items-center">
        <h3 class="text-warning"><img src="image/users_icon.svg" style="max-width: 100%; width: 30px;"> Players</h3>

        <div>
          <span class="p-1 rounded text-white" style="background-color: green;">Online: <span id="stat_online" class="text-warning"></span></span>
          <span class="rounded p-1 text-white" style="background-color: purple;">In game: <span id="stat_ingame" class="text-warning">0</span></span>
        </div>
      </div>

      <div class="d-flex bg bg-black p-3 rounded border border-dark justify-content-between mt-3">
        <div class="d-flex align-items-center gap-2">
          <span class="text-warning">Search:</span>
          <input type="text" class="bg bg-dark border border-black text-light focus-ring focus-ring-dark rounded p-1" id="searchInput" />
        </div>
        <div class="d-flex align-items-center">
          <button type="button" class="btn btn-warning focus-ring focus-ring-warning" data-bs-toggle="modal" data-bs-target="#staticBackdrop">Add Player</button>
        </div>
      </div>

      <div id="list_players" class="border border-dark mt-4 rounded"></div>
    </div>
  </section>

<!-- Modal -->
<div class="modal fade" id="staticBackdrop" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="staticBackdropLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content bg-prin border border-dark">
      <div class="modal-header border-top border-dark">
        <h1 class="modal-title fs-5 text-danger" id="staticBackdropLabel">Add Player</h1>
        <button type="button" class="btn-close" style="filter: invert(21%) sepia(100%) saturate(7414%) hue-rotate(357deg) brightness(93%) contrast(116%);" data-bs-dismiss="modal" aria-label="Close"></button>


      </div>
      <div class="modal-body">
        <div class="d-flex flex-column gap-2">
          <div id="box_alert"></div>
          <div class="d-flex align-items-center">
            <span class="text-warning" style="max-width: 100%; width: 150px;">SteamId:</span>
            <input type="text" class="bg bg-dark border border-black rounded focus-ring focus-ring-dark text-light p-1" id="input_steamid" />
          </div>
          <div class="d-flex align-items-center">
            <span class="text-warning" style="max-width: 100%; width: 150px;">DisplayName:</span>
            <input type="text" class="bg bg-dark border border-black rounded focus-ring focus-ring-dark text-light p-1" id="input_displayname" />
          </div>
          <div class="d-flex align-items-center">
            <span class="text-warning" style="max-width: 100%; width: 150px;">Avatar:</span>
            <input type="text" class="bg bg-dark border border-black rounded focus-ring focus-ring-dark text-light p-1" id="input_avatar" />
          </div>
          <div class="d-flex align-items-center">
            <span class="text-warning" style="max-width: 100%; width: 150px;">Profile URL:</span>
            <input type="text" class="bg bg-dark border border-black rounded focus-ring focus-ring-dark text-light p-1" id="input_profileurl" />
          </div>
        </div>
      </div>
      <div class="modal-footer border-bottom border-dark">
        <button type="button" class="btn btn-secondary focus-ring focus-ring-secondary" data-bs-dismiss="modal">Close</button>
        <button type="button" class="btn btn-danger focus-ring focus-ring-danger" id="btn_add_player">Add</button>
      </div>
    </div>
  </div>
</div>

  <script src="client/header_admin.js" type="module"></script>
  <script src="client/panel_players.js" type="module"></script>
</body>
</html>
