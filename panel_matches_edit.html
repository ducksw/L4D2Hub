<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.12.1/font/bootstrap-icons.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
    crossorigin="anonymous"></script>
  <link rel="stylesheet" href="css/admin.css">
  <link rel="icon" href="icon.webp" type="image/gif" sizes="16x16">
  <title>L4D2 Hub - panel</title>
</head>

<body>
  <header id="header_admin"></header>
  <section class="d-flex">
    <div id="nav_bar"></div>

    <div class="w-100 p-4">
      <h3 class="text-warning">GAME ID: <span id="gm_id" class="text-info"></span></h3>
      <div class="d-flex align-items-center gap-3 w-100 mt-4 bg bg-black p-3 rounded border border-dark">

        <!-- SURVIVORS -->
        <div class="d-flex flex-column flex-fill" style="min-width: 0;">
          <span class="mt-5 text-primary text-center fs-2">SURVIVORS</span>
          <div id="box_survivors" class="d-flex flex-column gap-2 border border-dark rounded p-2 mt-2" style="height: 400px; background-color: #111111;"></div>
          <div class="d-flex align-items-center justify-content-center gap-2 mt-3">
            <span class="text-warning">Score: </span>
            <input type="" id="score_survivors">
          </div>
        </div>

        <div class="d-flex flex-column text-center">
          <button class="btn btn-success focus-ring focus-ring-success" id="update_match">UPDATE</button>
        </div>

        <!-- INFECTEDS -->
        <div class="d-flex flex-column flex-fill" style="min-width: 0;">
          <span class="mt-5 text-danger text-center fs-2">INFECTEDS</span>
          <div id="box_infecteds" class="d-flex flex-column gap-2  border border-dark rounded p-2 mt-2" style="height: 400px; background-color: #111111;"></div>
          <div class="d-flex align-items-center justify-content-center gap-2 mt-3">
            <span class="text-warning">Score: </span>
            <input type="" id="score_infecteds">
          </div>
        </div>

      </div>
    </div>
  </section>

  <script src="client/header_admin.js" type="module"></script>
  <script src="client/panel_matches_edit.js" type="module"></script>
</body>

</html>
