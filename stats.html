<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.12.1/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap"
    rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
    crossorigin="anonymous"></script>
  <link rel="icon" href="icon.webp" type="image/gif" sizes="16x16">
  <link rel="stylesheet" href="css/style.css">

  <title>Stats</title>
</head>

<body>

  <header class="d-flex gap-2 bg-prin p-custom rounded-custom mb-3" id="header"></header>


  <div class="d-none justify-content-between gap-4 bg bg-black border border-dark p-2 rounded mb-3 header" id="mobile">
  </div>

  <div id="alert"></div>

  <section class="bg-prin p-custom mt-3 rounded-custom sec">
    <div class="d-flex justify-content-between align-items-center">
      <div>
        <span class="text-warning">Steam Id: <span id="steam_id" class="text-danger"></span></span>
      </div>
      <div class="d-flex gap-2 text-decoration-none">
        <a href="#" id="my_stats" class="text-decoration-none text-info link_hover">My Stats</a> |
        <a href="rankings.html" class="text-decoration-none text-info link_hover">Rankings</a> |
        <a href="#" class="text-decoration-none text-info link_hover" id="download_data">Data(JSON)</a>
      </div>
      <div class="d-flex align-items-center gap-2" id="form">
        <span class="text-warning">Search:</span>
        <input type="text" name="search" placeholder="Name" id="searchInput" class="input form-control bg bg-dark text-light border border-black focus-ring focus-ring-secondary">
      </div>
    </div>
  </section>

  <section class="bg-prin p-custom mt-3 rounded-custom sec" style="overflow: auto;">
    <div id="res"></div>
  </section>

  <script src="client/stats.js" type="module"></script>
  <script src="client/header.js" type="module"></script>
</body>

</html>
