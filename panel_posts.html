<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.12.1/font/bootstrap-icons.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
    crossorigin="anonymous"></script>
  <link rel="stylesheet" href="css/admin.css">
  <link rel="icon" href="icon.webp" type="image/gif" sizes="16x16">
  <title>L4D2 Hub - panel</title>
</head>

<body>
  <header id="header_admin"></header>

  <section class="d-flex">

    <div id="nav_bar"></div>

    <div class="w-100 p-4">
      <div class="d-flex justify-content-between">
        <h3 class="text-warning"><img src="image/news_icon.svg" style="max-width: 100%; width: 30px;"> Posts</h3>
        <div>
          <button class="btn btn-primary" id="btn_create">Create</button>
          <button class="btn btn-success" id="btn_update">Update</button>
        </div>
      </div>

      <div class="d-flex flex-column mt-3">
        <input type="text" class="bg bg bg-black border border-dark focus-ring focus-ring-dark p-2 rounded text-danger" id="title_input" placeholder="Título"> 
        <textarea name="" class="mt-3 bg bg bg-black border border-dark focus-ring focus-ring-dark p-2 rounded text-light" id="text_input" style="height: 500px; resize: none;" placeholder="Texto"></textarea>

        <input type="text" class="bg bg bg-black border border-dark focus-ring focus-ring-dark p-2 rounded text-danger mt-3" id="image_link_input" placeholder="Link de la imagen"> 
      </div>

      <div class="d-flex flex-column bg bg-black rounded border border-dark mt-4">
        <div class="d-flex justify-content-between title_custom align-items-center">
          <div>
            <img src="../image/news_icon.svg" style="max-width: 100%; width: 30px;">
            <span class="text-warning">Últimos Posts</span>
          </div>
        </div>

        <div class="d-flex flex-column">
          <div id="box_posts" class="d-flex flex-column gap-2 p-3"></div>
        </div>

      </div>

  </section>

  <script src="client/header_admin.js" type="module"></script>
  <script src="client/panel_posts.js" type="module"></script>
</body>
</html>
