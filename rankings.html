<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.12.1/font/bootstrap-icons.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
    crossorigin="anonymous"></script>
  <link rel="icon" href="icon.webp" type="image/gif" sizes="16x16">
  <link rel="stylesheet" href="css/style.css">
  <title>Rankings</title>
</head>

<body id="body">
  <header class="d-flex gap-2 bg-prin p-custom rounded-custom mb-3" id="header"></header>


  <div class="d-none justify-content-between gap-4 bg bg-black border border-dark p-2 rounded mb-3 header" id="mobile">
  </div>

  <section class="d-flex flex-column flex-md-row justify-content-between bg-prin p-custom mt-3 rounded-custom sec align-items-center gap-3">
  
    <div class="d-flex align-items-center gap-3 order-1 order-md-2 w-100 w-md-auto justify-content-end">
      <a href="myRanking.html" class="btn btn-warning focus-ring focus-ring-warning">TIERLIST</a>
      <div id="res3" class="select_players_ranking"></div>
    </div>

    <div class="d-flex justify-content-between w-100 w-md-25 gap-3 order-2 order-md-1">
      <div class="d-flex flex-column">
        <b class="text-secondary">Action</b>
        <a href="rankings.html" class="text-info text-decoration-none link_hover">Rankings Global</a>
        <a href="stats.html" class="text-info text-decoration-none link_hover">Stats Global</a>
      </div>
    </div>

  </section>

  <section class="d-flex bg-prin p-custom mt-3 rounded-custom">
    <div class="d-flex flex-column w-100">
      <b class="w-100 p-2 text-light text-center rounded h4 ranking title_osi">Estoy Fudiosoooo!! 😾</b>

      <!-- ELO -->
      <div id="res-elo"></div>

      <hr class="border border-secondary" />

      <!-- DAMAGE -->
      <div id="res-damage"></div>

      <hr class="border border-secondary" />

      <!-- KILL -->
      <div id="res-kill"></div>

      <hr class="border border-secondary" />

      <!-- WIN -->
      <div id="res-win"></div>

      <hr class="border border-secondary" />

      <!-- LOSER -->
      <div id="res-loser"></div>
    </div>
  </section>

  <section class="d-flex bg-prin p-custom mt-3 rounded-custom sec">
    <div class="d-flex flex-column w-100">
      <b class="w-100 p-2 text-light text-center rounded h4 ranking title_osi">PT QUE ASCOOO</b>

      <!-- ELO -->
      <div id="res-elo-noob"></div>

      <hr class="border border-secondary" />

      <!-- DAMAGE -->
      <div id="res-damage-noob"></div>

      <hr class="border border-secondary" />

      <!-- KILL -->
      <div id="res-kill-noob"></div>

      <hr class="border border-secondary" />

      <!-- WIN -->
      <div id="res-win-noob"></div>

      <hr class="border border-secondary" />

      <!-- LOSER -->
      <div id="res-loser-noob"></div>
    </div>
  </section>

  <br />
  <h1 class="mt-3 text-center text-light rounded title_osi">Other Ranking</h1>


  <section class="d-flex gap-2 justify-content-between mt-3 text-light bg-prin rounded-custom p-custom sec sec2 other_ranking_box">
    <!-- Elo Leaderboard -->
    <div class="w-50 p-2 rounded bg_other_ranking other_ranking_stat">
      <b class="h5 d-flex justify-content-center bg-gradient bg-warning rounded text-black p-1 title_osi">Elo Leaderboard</b>
      <div class="d-flex flex-column mt-3" id="elo-leaderboard"></div>
    </div>

    <!-- Wins Leaderboard -->
    <div class="w-50 p-2 rounded bg_other_ranking other_ranking_stat">
      <b class="h5 d-flex justify-content-center bg-gradient bg-secondary rounded p-1 text-light title_osi">Wins Leaderboard</b>
      <div class="d-flex flex-column mt-3" id="wins-leaderboard"></div>
    </div>

    <!-- Damage Leaderboard -->
    <div class="w-50 p-2 rounded bg_other_ranking other_ranking_stat">
      <b class="h5 d-flex justify-content-center bg-gradient bg-danger rounded p-1 text-light title_osi">Damage Leaderboard</b>
      <div class="d-flex flex-column mt-3" id="damage-leaderboard"></div>
    </div>
  </section>

  <section class="d-flex gap-2 justify-content-between mt-3 text-light bg-prin rounded-custom p-custom sec sec2 other_ranking_box">
    <!-- Kills Leaderboard -->
    <div class="w-50 p-2 rounded bg_other_ranking other_ranking_stat">
      <b class="h5 d-flex justify-content-center bg-gradient bg-info rounded p-1 text-black title_osi">(I)Kills Leaderboard</b>
      <div class="d-flex flex-column mt-3" id="kills-leaderboard"></div>
    </div>

    <!-- Matchs Leaderboard -->
    <div class="w-50 p-2 rounded bg_other_ranking other_ranking_stat">
      <b class="h5 d-flex justify-content-center bg-gradient bg-success rounded p-1 text-light title_osi">Matchs Leaderboard</b>
      <div class="d-flex flex-column mt-3" id="matchs-leaderboard"></div>
    </div>

    <!-- Rank Leaderboard -->
    <div class="w-50 p-2 rounded bg_other_ranking other_ranking_stat">
      <b class="h5 d-flex justify-content-center bg-gradient bg-black border border-dark rounded p-1 text-light title_osi">Rank Leaderboard</b>
      <div class="d-flex flex-column mt-3" id="rank-leaderboard"></div>
    </div>
  </section>

  <section class="d-flex gap-2 justify-content-between mt-3 text-light bg-prin rounded-custom p-custom sec sec2 other_ranking_box">
    <!-- Loser Leaderboard -->
    <div class="w-50 mx-auto p-2 rounded bg_other_ranking other_ranking_stat">
      <b class="h5 d-flex justify-content-center bg-gradient bg-dark rounded p-1 text-light title_osi">Loser Leaderboard</b>
      <div class="d-flex flex-column mt-3" id="loser-leaderboard"></div>
    </div>
  </section>


  <script src="client/ranking.js" type="module"></script>
  <script src="client/header.js" type="module"></script>
</body>

</html>
