<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.12.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=arrow_back_ios" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
    crossorigin="anonymous"></script>
  <link rel="stylesheet" href="css/admin.css">
  <link rel="icon" href="icon.webp" type="image/gif" sizes="16x16">
  <title>L4D2 Hub - panel</title>
</head>

<body>
  <header id="header_admin"></header>
  <section class="d-flex">
    <div id="nav_bar"></div>

    <div class="w-100 p-4">
      <div class="d-flex flex-column bg bg-black p-3 rounded border border-dark">
        <div class="d-flex gap-3 align-items-center mb-2">
          <a href="panel_players.html"><img src="./image/arrow_left.svg" class="rounded p-1 border border-dark"></a>
          <span class="text-light fs-4">Editando a <b class="text-danger" id="name_player_edit"></b> </span>
        </div>

        <div class="d-flex mt-4">
          <img src="" class="rounded" id="image_player_edit" />
        </div>

        <div class="d-flex flex-column gap-4 mt-4">
        <div class="d-flex gap-2">
        <div class="w-100">
            <b class="text-warning">Steam Id</b>
            <input type="text" id="steamid_input" class="form-control text-light bg bg-dark border border-black focus-ring focus-ring-secondary" value="">
            </div>
            <div class="w-100">
            <b class="text-danger">Diplay Name</b>
            <input type="text" id="displayname_input" class="form-control text-light bg-dark border border-black focus-ring focus-ring-secondary" value="">
        </div>
        </div>

        <div class="d-flex flex-column gap-4">
        <div class="w-100">
            <b class="text-danger">Avatar URL</b>
            <input type="text" id="avatar_input" class="form-control text-light bg-dark border border-black focus-ring focus-ring-secondary" value="">
            </div>
            <div class="w-100">
            <b class="text-danger">Profile URL</b>
            <input type="text" id="profileurl_input" class="form-control text-light bg-dark border border-black focus-ring focus-ring-secondary" value="">
        </div>
        </div>

        <div class="d-flex gap-2">
        <div class="w-100">
            <b class="text-danger">Match</b>
            <input type="text" id="match_input" class="form-control text-light bg-dark border border-black focus-ring focus-ring-secondary" value="">
            </div>
            <div class="w-100">
            <b class="text-danger">Elo</b>
            <input type="text" id="elo_input" class="form-control text-light bg-dark border border-black focus-ring focus-ring-secondary" value="">
            </div>
            <div class="w-100">
            <b class="text-danger">Points</b>
            <input type="text" id="points_input" class="form-control text-light bg-dark border border-black focus-ring focus-ring-secondary" value="">
        </div>
        </div>

        <div class="d-flex gap-2">
        <div class="w-100">
            <b class="text-danger">Damage</b>
            <input type="text" id="damage_input" class="form-control text-light bg-dark border border-black focus-ring focus-ring-secondary" value="">
            </div>
            <div class="w-100">
            <b class="text-danger">IKills</b>
            <input type="text" id="kills_input" class="form-control text-light bg-dark border border-black focus-ring focus-ring-secondary" value="">
            </div>
            <div class="w-100">
            <b class="text-danger">Wins</b>
            <input type="text" id="wins_input" class="form-control text-light bg-dark border border-black focus-ring focus-ring-secondary" value="">
        </div>
        </div>

        <div class="d-flex gap-2">
        <div class="w-100">
            <b class="text-danger">Loser</b>
            <input type="text" id="loser_input" class="form-control text-light bg-dark border border-black focus-ring focus-ring-secondary" value="">
            </div>
            <div class="w-100">
            <b class="text-danger">Draws</b>
            <input type="text" id="draw_input" class="form-control text-light bg-dark border border-black focus-ring focus-ring-secondary" value="">
            </div>
            <div class="w-100">
            <b class="text-danger">Rank</b>
            <input type="text" id="rank_input" class="form-control text-light bg-dark border border-black focus-ring focus-ring-secondary" value="">
        </div>
        </div>

        <button class="btn btn-success focus-ring focus-ring-success" style="max-width: 100%; width: 150px;" id="btn_update">Actualizar</button>

      </div>
    </div>
  </section>

  <script src="client/header_admin.js" type="module"></script>
  <script src="client/panel_players_edit.js" type="module"></script>
</body>
</html>
