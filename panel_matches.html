<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.12.1/font/bootstrap-icons.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
    crossorigin="anonymous"></script>
  <link rel="stylesheet" href="css/admin.css">
  <link rel="icon" href="icon.webp" type="image/gif" sizes="16x16">
  <title>L4D2 Hub - panel</title>
</head>

<body>
  <header id="header_admin"></header>
  <section class="d-flex">

    <div id="nav_bar"></div>
    <div class="w-100 p-4">
      <h3 class="text-warning">Matches</h3>

      <div class="d-flex align-items-center gap-3 w-100 mt-4 bg bg-black p-3 rounded border border-dark">

        <!-- SURVIVORS -->
        <div class="d-flex flex-column flex-fill" style="min-width: 0;">
          <div id="select_suvivors"></div>
          <span class="mt-5 text-primary text-center fs-2">SURVIVORS</span>
          <div id="box_suvivors" class="d-flex flex-column gap-2 border border-dark rounded p-2 mt-2" style="height: 400px; background-color: #111111;">
          </div>
        </div>

        <div class="d-flex flex-column text-center">
          <span class="text-warning fs-2">VERSUS</span>
          <button class="btn btn-danger focus-ring focus-ring-danger" id="create_match">CREAR MATCH!!</button>
          <div id="select_maps"></div>
        </div>

        <!-- INFECTEDS -->
        <div class="d-flex flex-column flex-fill" style="min-width: 0;">
          <div id="select_infecteds"></div>
          <span class="mt-5 text-danger text-center fs-2">INFECTEDS</span>
          <div id="box_infecteds" class="d-flex flex-column gap-2  border border-dark rounded p-2 mt-2" style="height: 400px; background-color: #111111;"></div>
        </div>

      </div>


      <div class="d-flex flex-column bg bg-black rounded border border-dark mt-4">
        <div class="d-flex justify-content-between title_custom align-items-center">
          <div>
            <img src="image/icon-cham.svg" style="max-width: 100%; width: 30px;">
            <span class="text-warning">Matches</span>
          </div>
        </div>

        <div class="d-flex flex-column">
          <div id="box_matches"></div>
        </div>

      </div>
    </div>

  </section>
  <script src="client/header_admin.js" type="module"></script>
  <script src="client/panel_matches.js" type="module"></script>
</body>

</html>
